name: Test Email Digest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without sending email"
        type: boolean
        default: true
      force:
        description: "Resend despite today's delivery ledger (may duplicate email)"
        type: boolean
        default: false

concurrency:
  group: email-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        id: email-cache
        with:
          path: data/.email_delivery.json
          key: ${{ runner.os }}-email-delivery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-email-delivery-v1-
      - name: Preview or send digest
        env:
          EMAIL_ENABLED: "true"
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -u scripts/send_digest.py "${args[@]}"
      - uses: actions/cache/save@v6
        if: ${{ always() && !inputs.dry_run && hashFiles('data/.email_delivery.json') != '' }}
        with:
          path: data/.email_delivery.json
          key: ${{ steps.email-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: email-test-results
          path: |
            data/email-status.json
            data/email-preview/
          retention-days: 7
