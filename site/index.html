<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>凝聚态论文日报</title>
  <link rel="stylesheet" href="./styles.css?v=20261014-bilingual" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 id="page-title">凝聚态论文日报</h1>
        <p id="page-meta">正在加载最新论文...</p>
      </div>
      <div class="controls">
        <input id="search" type="search" placeholder="搜索标题、作者、关键词" />
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>

    <section class="source-filters" id="source-filters"></section>

    <div class="edition-controls">
      <label for="edition">日报日期</label>
      <select id="edition" aria-label="日报日期"></select>
      <label class="ai-filter"><input id="ai-only" type="checkbox" /> 仅看 AI 导读</label>
      <div id="guide-language" class="language-switch" role="group" aria-label="导读语言">
        <button type="button" data-language="zh" aria-pressed="true">中文</button>
        <button type="button" data-language="en" aria-pressed="false">English</button>
        <button type="button" data-language="both" aria-pressed="false">中英对照</button>
      </div>
    </div>

    <div id="data-status" class="data-status" role="status" hidden></div>

    <section class="summary" id="summary"></section>

    <section class="daily-brief" id="daily-brief" aria-label="本期导读"></section>

    <section class="filters" id="filters"></section>

    <section class="paper-list" id="paper-list"></section>
  </main>

  <script defer src="./app.js?v=20261014-bilingual"></script>
</body>
</html>
