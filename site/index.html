<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>凝聚态论文日报</title>
  <link rel="stylesheet" href="./styles.css?v=20260625-source" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 id="page-title">凝聚态论文日报</h1>
        <p id="page-meta">正在加载最新论文...</p>
      </div>
      <div class="controls">
        <input id="search" type="search" placeholder="搜索标题、作者、关键词" />
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>

    <section class="summary" id="summary"></section>

    <section class="source-filters" id="source-filters"></section>

    <section class="filters" id="filters"></section>

    <section class="paper-list" id="paper-list"></section>
  </main>

  <script defer src="./app.js?v=20260625-source"></script>
</body>
</html>
